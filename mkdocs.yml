site_name: thienqc
site_description: thienqc's blog | Chia sẻ trải nghiệm sống, suy tư, và nhiều điều khác...
site_url: https://thienqc.github.io/blog/
site_author: thienqc
copyright: Copyright &copy; 2026 thienqc

# No explicit `nav:` - left auto-generated on purpose. An explicit nav
# (tried first, see git history) has to list every page it wants prev/
# next-linked; leaving post/'s ~290 files out of it to keep the 5
# category pages as a clean top-level tab bar also silently killed the
# "previous/next post" footer links (they only exist between pages that
# are actually in nav). Auto-nav keeps that working and still surfaces
# the 5 category pages (and Tags) in the sidebar automatically, same as
# tags.md already does - just alphabetically ordered, not curated.

theme:
    name: material
    custom_dir: overrides
    icon:
      logo: fontawesome/solid/brain
    favicon: assets/meta/favicon.svg
    font:
        text: JetBrains Mono
        code: JetBrains Mono
    language: vi
    static_templates:
      - 404.html
      - rss.xml
    palette:
      - media: "(prefers-color-scheme)"
        toggle:
          icon: material/link
          name: Switch to light mode
      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: indigo
        accent: indigo
        toggle:
          icon: material/toggle-switch
          name: Switch to dark mode
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: black
        accent: indigo
        toggle:
          icon: material/toggle-switch-off
          name: Switch to system preference
    features:
      - search.suggest
      - search.highlight
      - navigation.footer
      - navigation.indexes

hooks:
  - hooks/lazy_images.py
  - hooks/categories.py
  - hooks/posts_index.py
  - hooks/cache_bust.py
  - hooks/nav_quote.py

plugins:
  - search
  - autolinks
  - callouts
  - blogging:
      dirs:
        - post
      template: overrides/custom-blog.html
      features:
        tags:
          index_page: tags.md
          insert: bottom
      time_format: ' %d-%m-%Y '

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - tables
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true

extra_css:
    - assets/styles/extra.css

extra_javascript:
  - path: assets/js/site.js
    defer: true

extra:
  homepage: https://thienqc.github.io/
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/yds.thienqc/
      name: Facebook
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/thienqc/
      name: Instagram
    - icon: fontawesome/solid/envelope
      link: mailto:thienqc.sj@gmail.com
      name: Email
  analytics:
    provider: google
    property: G-WQ6QJ2DK27
