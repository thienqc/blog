<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho ebook</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=JetBrains+Mono:300,300i,400,400i,700,700i%7CJetBrains+Mono:400,400i,700,700i&display=fallback">
  <style>
    /* Light palette (default) — matches Material indigo/slate theme in mkdocs.yml */
    :root {
      --bg: #fff;
      --fg: #000000de;
      --fg-muted: #0000008a;
      --border: #00000012;
      --code-bg: #f5f5f5;
      --accent: #526cfe;
      --accent-dark: #3d54e0;
    }
    /* System dark mode, unless an explicit light/dark override is set below */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: hsla(225, 15%, 14%, 1);
        --fg: hsla(225, 15%, 90%, 0.82);
        --fg-muted: hsla(225, 15%, 90%, 0.56);
        --border: hsla(225, 15%, 90%, 0.12);
        --code-bg: hsla(225, 15%, 18%, 1);
        --accent: #526cfe;
        --accent-dark: #6b81ff;
      }
    }
    /* Explicit override synced from the main site's light/dark toggle */
    :root[data-theme="dark"] {
      --bg: hsla(225, 15%, 14%, 1);
      --fg: hsla(225, 15%, 90%, 0.82);
      --fg-muted: hsla(225, 15%, 90%, 0.56);
      --border: hsla(225, 15%, 90%, 0.12);
      --code-bg: hsla(225, 15%, 18%, 1);
      --accent: #526cfe;
      --accent-dark: #6b81ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace;
      line-height: 1.7;
      letter-spacing: -0.02em;
      padding: 2.5rem 1.25rem 4rem;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 0.2rem;
    }

    p.subtitle {
      color: var(--fg-muted);
      margin-top: 0;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .back-link {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 0.9em;
    }
    .back-link:hover {
      color: var(--accent);
    }

    #theme-toggle, #view-toggle {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    /* #theme-toggle holds an inline SVG (same icon set as the homepage
       toggle, ~/theme.js there) instead of text/emoji - size it like
       the homepage button's icon. */
    #theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
    }
    #theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    #theme-toggle:hover, #view-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #status {
      color: var(--fg-muted);
      margin: 1.25rem 0;
    }
    #status.error {
      color: #e6695b;
    }
    #status a {
      color: var(--accent);
    }

    ul.book-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
    }

    li.book {
      display: flex;
      gap: 1rem;
      padding: 1rem 1.25rem;
      margin-bottom: 0.9rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-left: 0.2rem solid var(--accent);
      border-radius: 0 6px 6px 0;
      scroll-margin-top: 1.5rem;
      transition: box-shadow 0.3s ease;
    }
    li.book.highlight {
      box-shadow: 0 0 0 3px var(--accent);
    }

    .book-list.view-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1.25rem;
    }
    .book-list.view-grid li.book {
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-left: 1px solid var(--border);
      cursor: pointer;
    }
    .book-list.view-grid .book-cover {
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      margin: 0 0 0.5rem;
    }
    .book-list.view-grid .book-author,
    .book-list.view-grid .book-description,
    .book-list.view-grid .book-size,
    .book-list.view-grid .book-actions {
      display: none;
    }
    .book-list.view-grid .book-title {
      font-size: 0.85em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-cover {
      flex: 0 0 auto;
      width: 64px;
      height: 92px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--border);
    }

    .book-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .book-title {
      font-weight: 700;
      overflow-wrap: break-word;
    }

    .book-author {
      color: var(--fg-muted);
      font-size: 0.95em;
    }

    .book-description {
      font-size: 0.88em;
      color: var(--fg-muted);
      overflow-wrap: break-word;
    }

    .book-size {
      color: var(--fg-muted);
      font-size: 0.8em;
    }

    .book-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.3rem;
    }

    .btn {
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      text-decoration: none;
      white-space: nowrap;
      font-family: inherit;
      font-size: 0.85em;
      border: none;
      cursor: pointer;
    }

    .btn-read {
      background: var(--accent);
      color: #fff;
    }
    .btn-read:hover {
      background: var(--accent-dark);
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Reader modal */
    #reader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #reader-overlay.open {
      display: flex;
    }

    #reader-modal {
      background: var(--bg);
      width: min(1200px, 96vw);
      height: min(920px, 94vh);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.4);
    }
    #reader-modal:fullscreen, #reader-modal:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
    }

    #reader-header {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
    }

    #reader-title {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #reader-close, #reader-toc-toggle, #reader-fullscreen {
      background: transparent;
      border: none;
      color: var(--fg);
      font-size: 1.3em;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      flex-shrink: 0;
    }
    #reader-close:hover, #reader-toc-toggle:hover, #reader-fullscreen:hover {
      color: var(--accent);
    }

    #toc-panel {
      position: absolute;
      inset: 0 auto 0 0;
      width: min(300px, 80%);
      background: var(--bg);
      border-right: 1px solid var(--border);
      box-shadow: 0.3rem 0 1rem rgba(0, 0, 0, 0.25);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    #toc-panel.open {
      transform: translateX(0);
    }
    #toc-panel-header {
      font-weight: 700;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    #toc-list {
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    #toc-list ul {
      list-style: none;
      margin: 0;
      padding-left: 1rem;
    }
    #toc-list > ul {
      padding-left: 0;
    }
    #toc-list a {
      display: block;
      padding: 0.4rem 1rem;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.9em;
      overflow-wrap: break-word;
    }
    #toc-list a:hover {
      color: var(--accent);
      background: var(--code-bg);
    }
    #toc-empty {
      padding: 1rem;
      color: var(--fg-muted);
      font-size: 0.9em;
    }

    #reader-body {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #viewer {
      position: absolute;
      inset: 0;
    }

    #reader-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--fg-muted);
      text-align: center;
      padding: 1rem;
    }
    #reader-loading.hidden {
      display: none;
    }
    #reader-loading .retry-btn {
      display: none;
    }
    #reader-loading.error .retry-btn {
      display: inline-block;
    }
    #reader-loading.error {
      color: #e6695b;
    }

    #reader-nav {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-top: 1px solid var(--border);
    }

    #reader-nav button {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 6px;
      padding: 0.4rem 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    #reader-nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #reader-status {
      color: var(--fg-muted);
      font-size: 0.85em;
    }

    #font-size-control {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    #font-size-control button {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85em;
    }
    #font-size-control button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    #font-size-label {
      color: var(--fg-muted);
      font-size: 0.8em;
      min-width: 2.8em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div>
        <h1>Kho ebook</h1>
        <p class="subtitle">Đọc trực tiếp trên trình duyệt hoặc tải file .epub về máy.</p>
      </div>
      <div style="display:flex; gap:0.5rem; flex-shrink:0;">
        <button id="view-toggle" aria-label="Đổi kiểu xem" title="Đổi kiểu xem"></button>
        <button id="theme-toggle" aria-label="Đổi giao diện sáng/tối"></button>
      </div>
    </div>
    <a class="back-link" href="./">← Quay lại trang blog</a>

    <div id="status">Đang tải danh sách...</div>
    <ul class="book-list" id="book-list"></ul>
  </div>

  <div id="reader-overlay">
    <div id="reader-modal">
      <div id="reader-header">
        <button id="reader-toc-toggle" aria-label="Mục lục" title="Mục lục">☰</button>
        <div id="reader-title"></div>
        <button id="reader-fullscreen" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>
        <button id="reader-close" aria-label="Đóng">&times;</button>
      </div>
      <div id="reader-body">
        <div id="viewer"></div>
        <div id="reader-loading">
          <span id="reader-loading-text">Đang tải sách...</span>
          <button class="btn btn-outline retry-btn" id="reader-retry">Thử lại</button>
        </div>
        <div id="toc-panel">
          <div id="toc-panel-header">Mục lục</div>
          <div id="toc-list"></div>
        </div>
      </div>
      <div id="reader-nav">
        <button id="reader-prev">‹ Trang trước</button>
        <span id="reader-status"></span>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <button id="flow-toggle" title="Đổi kiểu xem"></button>
          <div id="font-size-control">
            <button id="font-size-dec" title="Giảm cỡ chữ">A−</button>
            <span id="font-size-label">100%</span>
            <button id="font-size-inc" title="Tăng cỡ chữ">A+</button>
          </div>
          <button id="reader-next">Trang sau ›</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---- sync với light/dark của trang chính (Material for MkDocs) ----
    // Material lưu lựa chọn sáng/tối vào localStorage theo key riêng cho từng
    // thư mục (new URL(".", location).pathname + ".__palette"). Vì ebook.html
    // nằm ngay gốc docs/, key này trùng với key của trang chủ "/blog/" — đọc
    // và ghi lại đúng key đó để 2 trang khớp nhau khi người dùng đổi ở trang chủ.
    // 3 trạng thái auto -> light -> dark -> auto, cùng icon/logic với
    // theme.js của trang chủ (thienqc.github.io/theme.js) - "auto" nghĩa là
    // chưa chọn gì, chỉ xoá data-theme + key, để CSS tự theo hệ thống.
    const PALETTE_KEY = new URL(".", location).pathname + ".__palette";
    const THEME_ICONS = {
      auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18V3z"/></svg>',
      light: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></g></svg>',
      dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    };
    const THEME_LABELS = {
      auto: "Đang theo hệ thống — bấm để chuyển sang giao diện sáng",
      light: "Đang dùng giao diện sáng — bấm để chuyển sang giao diện tối",
      dark: "Đang dùng giao diện tối — bấm để theo hệ thống",
    };
    const THEME_NEXT = { auto: "light", light: "dark", dark: "auto" };

    function readPalette() {
      try {
        const raw = localStorage.getItem(PALETTE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function currentThemeMode() {
      const attr = document.documentElement.getAttribute("data-theme");
      return attr === "dark" || attr === "light" ? attr : "auto";
    }

    function isCurrentlyDark() {
      const mode = currentThemeMode();
      return mode === "dark"
        || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    }

    function updateThemeIcon() {
      const btn = document.getElementById("theme-toggle");
      const mode = currentThemeMode();
      btn.innerHTML = THEME_ICONS[mode];
      btn.title = THEME_LABELS[mode];
      btn.setAttribute("aria-label", btn.title);
    }

    // Thứ tự đúng như danh sách "palette:" trong mkdocs.yml — Material chọn
    // theme dựa vào "index" này (không chỉ dựa vào color.scheme), nên phải
    // khớp chính xác thứ tự đó, nếu không bundle JS đầy đủ của Material sẽ
    // tự tính lại theme từ index sai và ghi đè lại màu mình vừa đổi.
    //   0 = tự động theo hệ thống, 1 = sáng (indigo/indigo), 2 = tối (black/indigo)
    function writePalette(mode) {
      if (mode === "auto") {
        try { localStorage.removeItem(PALETTE_KEY); } catch (e) { /* ignore */ }
        return;
      }
      const index = mode === "dark" ? 2 : 1;
      const palette = {
        index,
        color: {
          media: mode === "dark" ? "(prefers-color-scheme: dark)" : "(prefers-color-scheme: light)",
          scheme: mode === "dark" ? "slate" : "default",
          primary: mode === "dark" ? "black" : "indigo",
          accent: "indigo",
        },
      };
      try {
        localStorage.setItem(PALETTE_KEY, JSON.stringify(palette));
      } catch (e) { /* localStorage không khả dụng, bỏ qua */ }
    }

    function applyTheme(mode) {
      // mode: "auto" | "light" | "dark"
      if (mode === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", mode);
      updateThemeIcon();
      // applyReaderTheme được định nghĩa ở script bên dưới, nhưng hàm này
      // chỉ thực sự chạy khi có sự kiện (click/pageshow), tức là sau khi
      // toàn trang (cả 2 script) đã chạy xong - an toàn để gọi ở đây.
      applyReaderTheme();
    }

    (function initTheme() {
      const palette = readPalette();
      const scheme = palette && palette.color && palette.color.scheme;
      if (scheme === "slate") document.documentElement.setAttribute("data-theme", "dark");
      else if (scheme === "default") document.documentElement.setAttribute("data-theme", "light");
      // nếu không có gì lưu sẵn, để CSS tự theo prefers-color-scheme (auto)
      updateThemeIcon();
    })();

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const next = THEME_NEXT[currentThemeMode()];
      applyTheme(next);
      writePalette(next);
    });

    // Khi quay lại trang này bằng nút Back của trình duyệt, trang có thể được
    // phục hồi nguyên trạng từ bfcache thay vì tải lại — lúc đó initTheme() ở
    // trên không chạy lại nên theme cũ trên màn hình có thể lệch với
    // localStorage. Đọc lại mỗi khi trang được phục hồi kiểu này.
    window.addEventListener("pageshow", (e) => {
      if (!e.persisted) return;
      const palette = readPalette();
      const scheme = palette && palette.color && palette.color.scheme;
      if (scheme === "slate") applyTheme("dark");
      else if (scheme === "default") applyTheme("light");
      else applyTheme("auto");
    });
  </script>

  <script>
    const MANIFEST_URL = "assets/ebook/manifest.json";
    const ASSET_BASE = "assets/ebook/";
    const JSZIP_SRC = "assets/js/jszip.min.js";
    const EPUBJS_SRC = "assets/js/epub.min.js";
    const READ_TIMEOUT_MS = 20000;
    // Luôn ép 1 font đọc duy nhất — font riêng của từng epub hay bị thiếu/lỗi
    // khi hiển thị trong trình đọc, nên không cho chọn "theo sách" nữa.
    const READER_FONT = "Georgia, 'Times New Roman', serif";
    const FONT_SIZE_KEY = "ebook-reader-font-size";
    const FONT_SIZE_STEP = 10;
    const FONT_SIZE_MIN = 60;
    const FONT_SIZE_MAX = 200;

    const VIEW_STORAGE_KEY = "ebook-view-mode";
    const listEl = document.getElementById("book-list");
    const viewToggleBtn = document.getElementById("view-toggle");

    function applyViewMode(mode) {
      listEl.classList.toggle("view-grid", mode === "grid");
      // Icon thể hiện kiểu xem sẽ đổi SANG khi bấm — giống cách nút sáng/tối hoạt động.
      viewToggleBtn.textContent = mode === "grid" ? "📋" : "🖼";
      viewToggleBtn.title = mode === "grid" ? "Chuyển sang xem chi tiết" : "Chuyển sang xem chỉ bìa";
      viewToggleBtn.setAttribute("aria-label", viewToggleBtn.title);
    }

    let viewMode = localStorage.getItem(VIEW_STORAGE_KEY) || "detail";
    applyViewMode(viewMode);

    viewToggleBtn.addEventListener("click", () => {
      viewMode = viewMode === "grid" ? "detail" : "grid";
      applyViewMode(viewMode);
      try { localStorage.setItem(VIEW_STORAGE_KEY, viewMode); } catch (e) { /* ignore */ }
    });

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    async function loadBooks() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error(`Không đọc được manifest.json (${res.status})`);
        const books = await res.json();

        if (!Array.isArray(books) || books.length === 0) {
          statusEl.textContent = "Chưa có ebook nào.";
          return;
        }

        books.forEach(book => {
          const url = ASSET_BASE + encodeURIComponent(book.file);
          const shareUrl = new URL(`#${book.slug}`, location.href).href;

          const li = document.createElement("li");
          li.className = "book";
          li.id = book.slug;
          li.addEventListener("click", () => {
            if (listEl.classList.contains("view-grid")) {
              openReader(url, book.title || book.file);
            }
          });

          if (book.cover) {
            const img = document.createElement("img");
            img.className = "book-cover";
            img.src = ASSET_BASE + book.cover.split("/").map(encodeURIComponent).join("/");
            img.alt = book.title || book.file;
            li.appendChild(img);
          }

          const main = document.createElement("div");
          main.className = "book-main";

          const titleEl = document.createElement("div");
          titleEl.className = "book-title";
          titleEl.textContent = book.title || book.file;
          main.appendChild(titleEl);

          if (book.author) {
            const authorEl = document.createElement("div");
            authorEl.className = "book-author";
            authorEl.textContent = book.author;
            main.appendChild(authorEl);
          }

          if (book.description) {
            const descEl = document.createElement("div");
            descEl.className = "book-description";
            descEl.textContent = book.description;
            main.appendChild(descEl);
          }

          const sizeEl = document.createElement("div");
          sizeEl.className = "book-size";
          sizeEl.textContent = formatSize(book.size || 0);
          main.appendChild(sizeEl);

          const actions = document.createElement("div");
          actions.className = "book-actions";

          const readBtn = document.createElement("button");
          readBtn.className = "btn btn-read";
          readBtn.textContent = "Đọc";
          readBtn.addEventListener("click", () => openReader(url, book.title || book.file));

          const dlLink = document.createElement("a");
          dlLink.className = "btn btn-outline";
          dlLink.href = url;
          dlLink.textContent = "Tải về";
          dlLink.setAttribute("download", book.file);

          const copyBtn = document.createElement("button");
          copyBtn.className = "btn btn-outline";
          copyBtn.textContent = "Copy link";
          copyBtn.addEventListener("click", () => copyLink(copyBtn, shareUrl));

          actions.appendChild(readBtn);
          actions.appendChild(dlLink);
          actions.appendChild(copyBtn);
          main.appendChild(actions);

          li.appendChild(main);
          listEl.appendChild(li);
        });

        statusEl.remove();
        scrollToHashBook();
      } catch (err) {
        statusEl.classList.add("error");
        statusEl.textContent = `Không tải được danh sách ebook: ${err.message}`;
      }
    }

    function scrollToHashBook() {
      const slug = location.hash.slice(1);
      if (!slug) return;
      const el = document.getElementById(slug);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("highlight");
      setTimeout(() => el.classList.remove("highlight"), 2000);
    }

    async function copyLink(btn, url) {
      const original = btn.textContent;
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = "Đã copy!";
      } catch (e) {
        btn.textContent = "Không copy được";
      }
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    // ---- epub.js reader (vendored local: jszip.min.js + epub.min.js) ----
    let scriptsPromise = null;
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Không tải được ${src}`));
        document.head.appendChild(script);
      });
    }
    function ensureReaderLibs() {
      if (window.ePub) return Promise.resolve();
      if (!scriptsPromise) {
        scriptsPromise = loadScript(JSZIP_SRC).then(() => loadScript(EPUBJS_SRC));
      }
      return scriptsPromise;
    }

    function withTimeout(promise, ms, message) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    let currentBook = null;
    let currentRendition = null;

    const overlay = document.getElementById("reader-overlay");
    const titleEl2 = document.getElementById("reader-title");
    const statusEl2 = document.getElementById("reader-status");
    const loadingEl = document.getElementById("reader-loading");
    const loadingTextEl = document.getElementById("reader-loading-text");
    const retryBtn = document.getElementById("reader-retry");
    const prevBtn = document.getElementById("reader-prev");
    const nextBtn = document.getElementById("reader-next");
    const closeBtn = document.getElementById("reader-close");
    const fullscreenBtn = document.getElementById("reader-fullscreen");
    const readerModal = document.getElementById("reader-modal");
    const tocToggleBtn = document.getElementById("reader-toc-toggle");
    const tocPanel = document.getElementById("toc-panel");
    const tocListEl = document.getElementById("toc-list");
    const fontSizeLabel = document.getElementById("font-size-label");
    const fontSizeDecBtn = document.getElementById("font-size-dec");
    const fontSizeIncBtn = document.getElementById("font-size-inc");

    let fontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY), 10);
    if (!fontSize || isNaN(fontSize)) fontSize = 100;

    function applyFontSize() {
      fontSizeLabel.textContent = fontSize + "%";
      if (currentRendition) currentRendition.themes.fontSize(fontSize + "%");
    }

    fontSizeDecBtn.addEventListener("click", () => {
      fontSize = Math.max(FONT_SIZE_MIN, fontSize - FONT_SIZE_STEP);
      try { localStorage.setItem(FONT_SIZE_KEY, fontSize); } catch (e) { /* ignore */ }
      applyFontSize();
    });
    fontSizeIncBtn.addEventListener("click", () => {
      fontSize = Math.min(FONT_SIZE_MAX, fontSize + FONT_SIZE_STEP);
      try { localStorage.setItem(FONT_SIZE_KEY, fontSize); } catch (e) { /* ignore */ }
      applyFontSize();
    });

    // Sách epub tự mang theo CSS riêng (thường viết cho nền trắng, chữ
    // đen) - rendition.themes.default() không tự động thừa hưởng biến
    // --bg/--fg của trang ngoài, nên khi trang ngoài chuyển tối, nội
    // dung sách vẫn đen trên nền tối nếu không ép màu thủ công ở đây.
    // Đọc trực tiếp từ CSS custom property hiện tại (không hardcode
    // màu riêng) để luôn khớp đúng với khung ngoài, kể cả khi theme đổi
    // giữa lúc đang đọc.
    function applyReaderTheme() {
      if (!currentRendition) return;
      const style = getComputedStyle(document.documentElement);
      const bg = style.getPropertyValue("--bg").trim();
      const fg = style.getPropertyValue("--fg").trim();
      const accent = style.getPropertyValue("--accent").trim();
      currentRendition.themes.default({
        "html": {
          "background": bg + " !important",
        },
        "body": {
          "background": bg + " !important",
          "color": fg + " !important",
          "text-align": "justify !important",
          "text-justify": "inter-word !important",
          "line-height": "1.6 !important",
        },
        "p, div, span, li, h1, h2, h3, h4, h5, h6": {
          "color": fg + " !important",
        },
        "p": {
          "text-align": "justify !important",
          "text-justify": "inter-word !important",
        },
        "a, a *": {
          "color": accent + " !important",
        },
      });
    }

    let wheelLocked = false;
    function setupReaderThemes(rendition) {
      applyReaderTheme();
      rendition.themes.font(READER_FONT);
      applyFontSize();

      if (flowMode === "paginated") {
        // epub.js không forward sự kiện "wheel" từ iframe ra ngoài như
        // keydown/keyup ở flow lật trang - cuộn chuột không tự lật trang,
        // nên giả lập thủ công. Flow cuộn dọc thì không cần, trình duyệt
        // tự cuộn nội dung sẵn.
        rendition.hooks.content.register((contents) => {
          contents.document.addEventListener("wheel", (e) => {
            if (wheelLocked) return;
            wheelLocked = true;
            setTimeout(() => { wheelLocked = false; }, 500);
            if (e.deltaY > 0) rendition.next();
            else if (e.deltaY < 0) rendition.prev();
          }, { passive: true });
        });
      }
    }

    // "scroll" = 1 trang, cuộn dọc liên tục (epub.js flow "scrolled-doc") -
    // mặc định, dễ đọc trên điện thoại hơn.
    // "paginated" = 2 trang, lật ngang (epub.js flow "paginated" + spread
    // "auto" - tự xuống 1 trang trên màn hình hẹp).
    const FLOW_STORAGE_KEY = "ebook-flow-mode";
    let flowMode = localStorage.getItem(FLOW_STORAGE_KEY) || "scroll";
    const flowToggleBtn = document.getElementById("flow-toggle");

    function applyFlowIcon() {
      // Icon thể hiện kiểu sẽ đổi SANG khi bấm, giống nút bìa/chi tiết ở
      // trang danh sách.
      flowToggleBtn.textContent = flowMode === "scroll" ? "📖" : "📜";
      flowToggleBtn.title = flowMode === "scroll"
        ? "Chuyển sang xem 2 trang (lật ngang)"
        : "Chuyển sang xem 1 trang (cuộn dọc)";
      flowToggleBtn.setAttribute("aria-label", flowToggleBtn.title);
    }
    applyFlowIcon();

    flowToggleBtn.addEventListener("click", () => {
      flowMode = flowMode === "scroll" ? "paginated" : "scroll";
      try { localStorage.setItem(FLOW_STORAGE_KEY, flowMode); } catch (e) { /* ignore */ }
      applyFlowIcon();
      // Đổi flow đang lúc đọc dở - epub.js không hỗ trợ đổi flow trên
      // rendition đang chạy, phải mở lại sách để dựng lại rendition mới.
      if (lastOpened) openReader(lastOpened.url, lastOpened.title);
    });

    let lastOpened = null;

    function renderTocLevel(items) {
      const ul = document.createElement("ul");
      items.forEach(item => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = (item.label || "").trim() || item.href;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          if (currentRendition) currentRendition.display(item.href);
          tocPanel.classList.remove("open");
        });
        li.appendChild(a);
        if (item.subitems && item.subitems.length) {
          li.appendChild(renderTocLevel(item.subitems));
        }
        ul.appendChild(li);
      });
      return ul;
    }

    function loadToc(book) {
      tocListEl.innerHTML = "";
      book.loaded.navigation.then(nav => {
        if (!nav.toc || nav.toc.length === 0) {
          tocListEl.innerHTML = '<div id="toc-empty">Sách này không có mục lục.</div>';
          return;
        }
        tocListEl.appendChild(renderTocLevel(nav.toc));
      }).catch(() => {
        tocListEl.innerHTML = '<div id="toc-empty">Không đọc được mục lục.</div>';
      });
    }

    tocToggleBtn.addEventListener("click", () => tocPanel.classList.toggle("open"));

    async function openReader(url, title) {
      lastOpened = { url, title };
      titleEl2.textContent = title;
      statusEl2.textContent = "";
      loadingEl.classList.remove("hidden", "error");
      loadingTextEl.textContent = "Đang tải sách...";
      overlay.classList.add("open");
      tocPanel.classList.remove("open");
      document.getElementById("viewer").innerHTML = "";

      try {
        await withTimeout(ensureReaderLibs(), READ_TIMEOUT_MS, "Không tải được thư viện đọc sách (quá thời gian chờ).");
        currentBook = ePub(url);
        loadToc(currentBook);
        // "scroll" (mặc định): flow "scrolled-doc" + manager "continuous",
        // cuộn dọc liên tục, dễ đọc trên điện thoại. "paginated": flow
        // phân trang mặc định của epub.js + spread "auto" (2 trang song
        // song khi màn hình đủ rộng, tự về 1 trang khi hẹp).
        const renderOpts = { width: "100%", height: "100%" };
        if (flowMode === "scroll") {
          renderOpts.flow = "scrolled-doc";
          renderOpts.manager = "continuous";
        } else {
          renderOpts.flow = "paginated";
          renderOpts.spread = "auto";
        }
        currentRendition = currentBook.renderTo("viewer", renderOpts);
        setupReaderThemes(currentRendition);
        currentRendition.on("keyup", handleReaderKey);
        currentRendition.on("keydown", (e) => {
          // Trình duyệt vẫn cuộn trang bằng phím mũi tên bên trong iframe
          // nếu không chặn ở đây — ngăn lại vì mình đã tự điều hướng trang.
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
        });
        await withTimeout(currentRendition.display(), READ_TIMEOUT_MS, "Tải nội dung sách quá lâu, có thể do mạng chậm.");
        loadingEl.classList.add("hidden");
      } catch (err) {
        loadingEl.classList.add("error");
        loadingTextEl.textContent = err.message || "Có lỗi khi mở sách.";
      }
    }

    retryBtn.addEventListener("click", () => {
      if (lastOpened) openReader(lastOpened.url, lastOpened.title);
    });

    function closeReader() {
      if (document.fullscreenElement === readerModal) document.exitFullscreen();
      overlay.classList.remove("open");
      tocPanel.classList.remove("open");
      tocListEl.innerHTML = "";
      if (currentRendition) {
        currentRendition.destroy();
        currentRendition = null;
      }
      if (currentBook) {
        currentBook.destroy();
        currentBook = null;
      }
      document.getElementById("viewer").innerHTML = "";
    }

    closeBtn.addEventListener("click", closeReader);

    fullscreenBtn.addEventListener("click", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        readerModal.requestFullscreen().catch(() => { /* trình duyệt/thiết bị không hỗ trợ, bỏ qua */ });
      }
    });
    document.addEventListener("fullscreenchange", () => {
      const isFull = document.fullscreenElement === readerModal;
      fullscreenBtn.textContent = isFull ? "⤢" : "⛶";
      fullscreenBtn.title = isFull ? "Thoát toàn màn hình" : "Toàn màn hình";
      fullscreenBtn.setAttribute("aria-label", fullscreenBtn.title);
    });
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeReader();
    });
    prevBtn.addEventListener("click", () => currentRendition && currentRendition.prev());
    nextBtn.addEventListener("click", () => currentRendition && currentRendition.next());

    // handleReaderKey được gắn theo 2 nguồn:
    // - currentRendition.on("keyup", ...): epub.js forward sự kiện bàn phím
    //   từ bên trong iframe của từng trang sách — đây là nguồn chính, vẫn
    //   hoạt động kể cả khi người dùng đang bôi đen văn bản trong iframe đó.
    // - document listener bên dưới: dự phòng cho lúc focus nằm ở khung ngoài
    //   (nút, thanh điều hướng) chứ không phải trong nội dung sách.
    function handleReaderKey(e) {
      if (!overlay.classList.contains("open")) return;
      if (e.key === "ArrowLeft") currentRendition && currentRendition.prev();
      if (e.key === "ArrowRight") currentRendition && currentRendition.next();
      if (e.key === "Escape") closeReader();
    }
    document.addEventListener("keydown", handleReaderKey);

    loadBooks();
  </script>
</body>
</html>
